<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSite - Web Games Collection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🎮 GameSite</h1>
        <p>Choose your favorite web game to play!</p>
    </header>
    
    <main>
        <div class="games-grid">
            <div class="game-card">
                <h2>🧩 Tetris</h2>
                <p>Classic block-stacking puzzle game</p>
                <a href="tetris.html" class="play-button">Play Now</a>
            </div>
            
            <!-- More games can be added here in the future -->
            <div class="game-card coming-soon">
                <h2>🎯 More Games</h2>
                <p>Coming soon...</p>
                <button class="play-button disabled" disabled>Coming Soon</button>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 GameSite - A demo repo for GitHub Copilot workspace</p>
    </footer>
</body>
</html>
