<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - GameSite</title>
    <link rel="stylesheet" href="tetris.css">
</head>
<body>
    <header>
        <h1>🧩 Tetris</h1>
        <a href="index.html" class="back-button">← Back to Games</a>
    </header>
    
    <main>
        <div class="game-container">
            <div class="game-info">
                <div class="score-panel">
                    <div class="score-item">
                        <label>Score:</label>
                        <span id="score">0</span>
                    </div>
                    <div class="score-item">
                        <label>Lines:</label>
                        <span id="lines">0</span>
                    </div>
                    <div class="score-item">
                        <label>Level:</label>
                        <span id="level">1</span>
                    </div>
                </div>
                
                <div class="next-piece">
                    <h3>Next Piece:</h3>
                    <canvas id="nextCanvas" width="80" height="80"></canvas>
                </div>
                
                <div class="controls">
                    <h3>Controls:</h3>
                    <p>← → Move</p>
                    <p>↓ Soft Drop</p>
                    <p>↑ Rotate</p>
                    <p>Space: Hard Drop</p>
                    <p>P: Pause</p>
                </div>
            </div>
            
            <div class="game-board">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div id="gameOver" class="game-over hidden">
                    <h2>Game Over!</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <button id="restartBtn" class="restart-button">Play Again</button>
                </div>
            </div>
        </div>
        
        <div class="game-controls">
            <button id="startBtn" class="control-button">Start Game</button>
            <button id="pauseBtn" class="control-button">Pause</button>
            <button id="resetBtn" class="control-button">Reset</button>
        </div>
    </main>
    
    <script src="tetris.js"></script>
</body>
</html>
